[project]
name = "landing-zone"
version = "0.1.0"
description = "Temporal workflow demo — cloud infrastructure provisioning landing zone"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
